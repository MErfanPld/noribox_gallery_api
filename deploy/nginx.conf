# Reference Nginx site for Noribox Gallery API (TLS terminated here).
# Forwarded headers are OVERWRITTEN with $remote_addr so clients cannot spoof
# their IP. Set TRUSTED_PROXIES to the address Nginx connects from
# (127.0.0.1/32 when Nginx and gunicorn share a host). If another proxy/CDN sits
# in front of Nginx, use the realip module (set_real_ip_from <cdn ranges>;
# real_ip_header X-Forwarded-For;) so $remote_addr is already the real client.
upstream noribox_api { server 127.0.0.1:8000; }

server {
    listen 443 ssl http2;
    server_name api.example.com;
    # ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 10m;

    location /static/ { alias /srv/noribox/staticfiles/; }
    location /media/  { alias /srv/noribox/media/; add_header X-Content-Type-Options nosniff; }
    # PRIVATE_MEDIA_ROOT (payment receipts) is intentionally NOT served.

    location / {
        proxy_pass http://noribox_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
